<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đưa Thỏ Về Chuồng - Toán 2</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700;900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
  }

  body {
    margin: 0;
    padding: 16px 12px;
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 10%, #cbf3f0 0%, #b2ebf2 40%, #80deea 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Nút chế độ Giáo viên góc trên */
  .btn-teacher-lock {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(255, 255, 255, 0.9);
    border: 2px solid #00b4d8;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 800;
    color: #0077b6;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }

  .title-header {
    background: #ffffff;
    border-radius: 30px;
    padding: 10px 32px;
    text-align: center;
    box-shadow: 0 8px 0 #4dd0e1, 0 12px 24px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    border: 3px solid #e0f7fa;
  }

  h1 {
    margin: 0;
    font-size: 26px;
    color: #ff5252;
    text-shadow: 1px 1px 0 #ffebee;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  p.guide {
    margin: 4px 0 0;
    font-size: 15px;
    color: #455a64;
    font-weight: 800;
  }

  /* Sân chơi */
  .arena {
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .rabbit-card {
    background: #ffffff;
    border-radius: 26px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 0 #81d4fa, 0 10px 16px rgba(0,0,0,0.06);
    border: 3px solid #b3e5fc;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    height: 108px;
  }

  .rabbit-card:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #81d4fa;
  }

  .house-card {
    background: #ffffff;
    border-radius: 26px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 0 #ffb74d, 0 10px 16px rgba(0,0,0,0.06);
    border: 3px solid #ffe0b2;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    height: 108px;
  }

  .house-card:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #ffb74d;
  }

  .rabbit-card.selected {
    background: #fffde7;
    border-color: #ffd54f;
    box-shadow: 0 8px 0 #ffa000, 0 12px 24px rgba(255, 160, 0, 0.3);
    transform: scale(1.04) translateX(6px);
    animation: bunnyJump 0.4s infinite alternate ease-in-out;
  }

  @keyframes bunnyJump {
    from { transform: scale(1.04) translateY(0); }
    to { transform: scale(1.04) translateY(-8px); }
  }

  .matched {
    opacity: 0.35 !important;
    pointer-events: none !important;
    transform: scale(0.95) !important;
    box-shadow: none !important;
  }

  .shake {
    animation: shakeError 0.35s ease;
  }

  @keyframes shakeError {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* Khung Pop-up chung */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
  }

  .modal-content {
    background: #ffffff;
    border-radius: 32px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    max-width: 440px;
    width: 90%;
  }

  .input-text {
    width: 100%;
    padding: 12px 18px;
    font-size: 18px;
    font-family: inherit;
    border-radius: 16px;
    border: 2px solid #b2ebf2;
    margin: 12px 0 18px;
    outline: none;
    text-align: center;
    font-weight: 700;
  }
  .input-text:focus {
    border-color: #00bcd4;
  }

  .btn-action {
    background: linear-gradient(135deg, #26de81, #20bf6b);
    color: white;
    font-size: 20px;
    font-weight: 900;
    border: none;
    border-radius: 20px;
    padding: 12px 28px;
    cursor: pointer;
    box-shadow: 0 5px 0 #1b8a4f;
    font-family: inherit;
  }

  /* Bảng Quản lí Giáo viên */
  .teacher-dashboard {
    max-width: 720px;
    width: 95%;
    max-height: 85vh;
    overflow-y: auto;
    text-align: left;
  }

  .rank-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    font-size: 16px;
  }

  .rank-table th {
    background: #00b4d8;
    color: white;
    padding: 10px;
    text-align: center;
    border-radius: 8px 8px 0 0;
  }

  .rank-table td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #e0e0e0;
    font-weight: 700;
  }

  .rank-top1 { color: #d90429; font-weight: 900; }
  .rank-top2 { color: #f77f00; font-weight: 900; }
  .rank-top3 { color: #38b000; font-weight: 900; }

  .btn-del-single {
    background: #ff6b6b;
    color: white;
    border: none;
    padding: 4px 8px;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>

<button class="btn-teacher-lock" onclick="promptTeacherLogin()">🔒 Dành cho Cô giáo</button>

<div class="title-header">
  <h1>🐰 ĐƯA THỎ VỀ CHUỒNG 🏠</h1>
  <p class="guide">Học sinh: <span id="current-player-name" style="color: #0077b6;">...</span> | Thời gian: <span id="timer-display" style="color: #d90429;">0s</span></p>
</div>

<div class="arena">
  <div class="col" id="col-rabbits"></div>
  <div class="col" id="col-houses"></div>
</div>

<!-- Modal 1: Nhập tên học sinh trước khi chơi -->
<div id="modal-start" class="modal-overlay">
  <div class="modal-content" style="border: 5px solid #4dd0e1;">
    <div style="font-size: 55px;">👋🐰</div>
    <h2 style="color: #0077b6; margin: 8px 0 4px;">CHÀO MỪNG CON!</h2>
    <p style="margin: 0; color: #555; font-size: 15px;">Hãy nhập Tên của mình để bắt đầu thi đua nhé:</p>
    <input type="text" id="player-input" class="input-text" placeholder="Ví dụ: Minh Anh 2A" autofocus>
    <button class="btn-action" onclick="startGame()">Vào Chơi Ngay 🚀</button>
  </div>
</div>

<!-- Modal 2: Thông báo hoàn thành & kết quả -->
<div id="modal-win" class="modal-overlay" style="display: none;">
  <div class="modal-content" style="border: 5px solid #26de81;">
    <div style="font-size: 60px;">🏆🎉🌟</div>
    <h2 style="color: #ff5252; font-size: 26px; margin: 8px 0;">BÉ THẬT XUẤT SẮC!</h2>
    <p id="win-summary" style="font-size: 18px; color: #455a64; margin: 6px 0 16px; font-weight: 800;"></p>
    <button class="btn-action" onclick="showStartModal()">Bạn Khác Chơi Tiếp 🔄</button>
  </div>
</div>

<!-- Modal 3: Bảng xếp hạng và quản trị của Giáo viên -->
<div id="modal-teacher" class="modal-overlay" style="display: none;">
  <div class="modal-content teacher-dashboard" style="border: 5px solid #0077b6;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="color: #0077b6; margin: 0; font-size: 22px;">📊 BẢNG XẾP HẠNG THI ĐUA (GIÁO VIÊN)</h2>
      <button onclick="closeTeacherModal()" style="border: none; background: #eee; border-radius: 50%; width: 32px; height: 32px; font-weight: 900; cursor: pointer;">✕</button>
    </div>
    
    <div style="margin: 14px 0; display: flex; gap: 10px;">
      <button onclick="clearAllResults()" style="background: #ff4757; color: white; border: none; padding: 8px 14px; border-radius: 12px; font-weight: 800; cursor: pointer;">🗑️ Xóa Tất Cả Dữ Liệu</button>
      <button onclick="exportData()" style="background: #2ed573; color: white; border: none; padding: 8px 14px; border-radius: 12px; font-weight: 800; cursor: pointer;">📥 Xem nhanh số lượng</button>
    </div>

    <table class="rank-table">
      <thead>
        <tr>
          <th>Hạng</th>
          <th>Tên Học Sinh</th>
          <th>Thời Gian</th>
          <th>Số Lần Sai</th>
          <th>Xóa</th>
        </tr>
      </thead>
      <tbody id="ranking-body"></tbody>
    </table>
  </div>
</div>

<script>
  function createRabbitSVG(mathText) {
    return `
    <svg viewBox="0 0 280 115" width="100%" height="100%">
      <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
          <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
        </filter>
      </defs>
      <ellipse cx="44" cy="28" rx="9" ry="24" fill="#FFFFFF" stroke="#37474f" stroke-width="3" transform="rotate(-15 44 28)"/>
      <ellipse cx="44" cy="29" rx="5" ry="16" fill="#ff80ab" transform="rotate(-15 44 29)"/>
      <ellipse cx="76" cy="28" rx="9" ry="24" fill="#FFFFFF" stroke="#37474f" stroke-width="3" transform="rotate(15 76 28)"/>
      <ellipse cx="76" cy="29" rx="5" ry="16" fill="#ff80ab" transform="rotate(15 76 29)"/>
      <ellipse cx="60" cy="58" rx="34" ry="29" fill="#FFFFFF" stroke="#37474f" stroke-width="3"/>
      <ellipse cx="48" cy="54" rx="4.5" ry="5.5" fill="#263238"/><circle cx="46.5" cy="52" r="1.8" fill="#FFFFFF"/>
      <ellipse cx="72" cy="54" rx="4.5" ry="5.5" fill="#263238"/><circle cx="70.5" cy="52" r="1.8" fill="#FFFFFF"/>
      <ellipse cx="40" cy="63" rx="5.5" ry="3.5" fill="#ff8a80" opacity="0.8"/>
      <ellipse cx="80" cy="63" rx="5.5" ry="3.5" fill="#ff8a80" opacity="0.8"/>
      <polygon points="60,60 57,57 63,57" fill="#ff5252"/>
      <path d="M57 63 Q60 66 63 63" fill="none" stroke="#37474f" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="60" cy="88" rx="26" ry="18" fill="#FFFFFF" stroke="#37474f" stroke-width="3"/>
      <ellipse cx="42" cy="98" rx="10" ry="6" fill="#FFFFFF" stroke="#37474f" stroke-width="2.5"/>
      <ellipse cx="78" cy="98" rx="10" ry="6" fill="#FFFFFF" stroke="#37474f" stroke-width="2.5"/>
      <g filter="url(#shadow)">
        <rect x="96" y="28" width="170" height="60" rx="18" fill="#ffb74d" stroke="#e65100" stroke-width="3"/>
        <rect x="101" y="33" width="160" height="50" rx="14" fill="#fff8e1"/>
        <text x="181" y="69" font-family="'Comfortaa', cursive" font-size="31" font-weight="900" fill="#d84315" text-anchor="middle">${mathText}</text>
      </g>
      <ellipse cx="94" cy="56" rx="6.5" ry="9" fill="#FFFFFF" stroke="#37474f" stroke-width="2.8" transform="rotate(-15 94 56)"/>
    </svg>`;
  }

  function createHouseSVG(numVal) {
    return `
    <svg viewBox="0 0 280 115" width="100%" height="100%">
      <defs>
        <filter id="houseShadow" x="-5%" y="-5%" width="110%" height="115%">
          <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
        </filter>
      </defs>
      <rect x="22" y="44" width="76" height="58" rx="8" fill="#ffe0b2" stroke="#4e342e" stroke-width="3.2"/>
      <line x1="38" y1="46" x2="38" y2="100" stroke="#d7ccc8" stroke-width="2"/>
      <line x1="60" y1="46" x2="60" y2="100" stroke="#d7ccc8" stroke-width="2"/>
      <line x1="82" y1="46" x2="82" y2="100" stroke="#d7ccc8" stroke-width="2"/>
      <path d="M12 48 L60 14 L108 48 Z" fill="#ff5252" stroke="#4e342e" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="60" cy="32" r="5" fill="#ffebee"/>
      <path d="M44 102 L44 70 Q60 58 76 70 L76 102 Z" fill="#6d4c41"/>
      <g filter="url(#houseShadow)">
        <rect x="120" y="24" width="144" height="66" rx="20" fill="#4fc3f7" stroke="#0277bd" stroke-width="3"/>
        <rect x="125" y="29" width="134" height="56" rx="16" fill="#e1f5fe"/>
        <text x="156" y="65" font-family="'Nunito', sans-serif" font-size="20" font-weight="900" fill="#0277bd">SỐ</text>
        <text x="214" y="70" font-family="'Comfortaa', cursive" font-size="38" font-weight="900" fill="#d50000" text-anchor="middle">${numVal}</text>
      </g>
    </svg>`;
  }

  const data = [
    { expr: "11 - 7", val: 4 },
    { expr: "11 - 8", val: 3 },
    { expr: "13 - 5", val: 8 },
    { expr: "11 - 5", val: 6 },
    { expr: "11 - 6", val: 5 },
    { expr: "11 - 4", val: 7 }
  ];

  let playerName = "";
  let timer = 0;
  let timerInterval = null;
  let wrongAttempts = 0;
  let matches = 0;
  let selectedRabbit = null;

  // Quản lí dữ liệu LocalStorage
  function getScores() {
    return JSON.parse(localStorage.getItem('rabbit_math_scores') || '[]');
  }
  function saveScores(scores) {
    localStorage.setItem('rabbit_math_scores', JSON.stringify(scores));
  }

  function showStartModal() {
    clearInterval(timerInterval);
    document.getElementById('modal-win').style.display = 'none';
    document.getElementById('modal-start').style.display = 'flex';
    document.getElementById('player-input').value = '';
  }

  function startGame() {
    const input = document.getElementById('player-input').value.trim();
    playerName = input || "Học sinh " + Math.floor(Math.random() * 100);
    document.getElementById('current-player-name').innerText = playerName;
    document.getElementById('modal-start').style.display = 'none';

    // Bắt đầu bấm giờ
    timer = 0;
    wrongAttempts = 0;
    document.getElementById('timer-display').innerText = "0s";
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timer++;
      document.getElementById('timer-display').innerText = timer + "s";
    }, 1000);

    initBoard();
  }

  function initBoard() {
    matches = 0;
    selectedRabbit = null;
    const colR = document.getElementById('col-rabbits');
    const colH = document.getElementById('col-houses');
    colR.innerHTML = '';
    colH.innerHTML = '';

    const shuffledR = [...data].sort(() => Math.random() - 0.5);
    const shuffledH = [...data].sort(() => Math.random() - 0.5);

    shuffledR.forEach(item => {
      const card = document.createElement('div');
      card.className = 'rabbit-card';
      card.dataset.val = item.val;
      card.innerHTML = createRabbitSVG(item.expr);
      card.onclick = () => selectRabbit(card);
      colR.appendChild(card);
    });

    shuffledH.forEach(item => {
      const card = document.createElement('div');
      card.className = 'house-card';
      card.dataset.val = item.val;
      card.innerHTML = createHouseSVG(item.val);
      card.onclick = () => selectHouse(card);
      colH.appendChild(card);
    });
  }

  function selectRabbit(card) {
    if (card.classList.contains('matched')) return;
    document.querySelectorAll('.rabbit-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedRabbit = card;
  }

  function selectHouse(hCard) {
    if (!selectedRabbit || hCard.classList.contains('matched')) return;

    if (selectedRabbit.dataset.val === hCard.dataset.val) {
      selectedRabbit.classList.remove('selected');
      selectedRabbit.classList.add('matched');
      hCard.classList.add('matched');
      selectedRabbit = null;
      matches++;

      if (matches === data.length) {
        clearInterval(timerInterval);
        // Lưu kết quả vào danh sách xếp hạng
        const record = {
          name: playerName,
          time: timer,
          wrongs: wrongAttempts,
          date: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
        };
        const scores = getScores();
        scores.push(record);
        saveScores(scores);

        // Hiển thị chúc mừng
        document.getElementById('win-summary').innerHTML = `
          Bạn <b>${playerName}</b> đã hoàn thành trong <b style="color:#d90429;">${timer} giây</b>!<br>
          (Số lần chọn chưa đúng: ${wrongAttempts})
        `;
        setTimeout(() => {
          document.getElementById('modal-win').style.display = 'flex';
        }, 300);
      }
    } else {
      wrongAttempts++;
      selectedRabbit.classList.add('shake');
      hCard.classList.add('shake');
      setTimeout(() => {
        if (selectedRabbit) selectedRabbit.classList.remove('shake');
        hCard.classList.remove('shake');
      }, 350);
    }
  }

  // --- CHỨC NĂNG DÀNH CHO GIÁO VIÊN ---
  function promptTeacherLogin() {
    const pwd = prompt("Nhập mật mã dành cho Giáo viên:");
    if (pwd === "12345") {
      openTeacherModal();
    } else if (pwd !== null) {
      alert("Mật mã không đúng!");
    }
  }

  function openTeacherModal() {
    renderRanking();
    document.getElementById('modal-teacher').style.display = 'flex';
  }

  function closeTeacherModal() {
    document.getElementById('modal-teacher').style.display = 'none';
  }

  function renderRanking() {
    const scores = getScores();
    // Tiêu chí xếp hạng: Thời gian ít hơn xếp trước, nếu bằng nhau thì ít lỗi hơn xếp trước
    scores.sort((a, b) => a.time - b.time || a.wrongs - b.wrongs);

    const tbody = document.getElementById('ranking-body');
    tbody.innerHTML = '';

    if (scores.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="color: #888;">Chưa có học sinh nào hoàn thành.</td></tr>';
      return;
    }

    scores.forEach((s, idx) => {
      let rankBadge = `${idx + 1}`;
      let rowClass = "";
      if (idx === 0) { rankBadge = "🥇 1"; rowClass = "rank-top1"; }
      else if (idx === 1) { rankBadge = "🥈 2"; rowClass = "rank-top2"; }
      else if (idx === 2) { rankBadge = "🥉 3"; rowClass = "rank-top3"; }

      const tr = document.createElement('tr');
      tr.className = rowClass;
      tr.innerHTML = `
        <td>${rankBadge}</td>
        <td>${s.name}</td>
        <td>${s.time} giây</td>
        <td>${s.wrongs} lần</td>
        <td><button class="btn-del-single" onclick="deleteScore(${idx})">✕</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function deleteScore(index) {
    const scores = getScores();
    scores.sort((a, b) => a.time - b.time || a.wrongs - b.wrongs);
    scores.splice(index, 1);
    saveScores(scores);
    renderRanking();
  }

  function clearAllResults() {
    if (confirm("Cô có chắc muốn xóa toàn bộ kết quả để bắt đầu lượt chơi mới không?")) {
      localStorage.removeItem('rabbit_math_scores');
      renderRanking();
    }
  }

  function exportData() {
    const count = getScores().length;
    alert(`Hiện tại đã có ${count} lượt học sinh tham gia hoàn thành bài.`);
  }

  // Khởi động lượt đầu tiên
  showStartModal();
</script>
</body>
</html>
